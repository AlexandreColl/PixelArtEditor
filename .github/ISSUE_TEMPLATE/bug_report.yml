name: 🐛 Reportar error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué ha pasado y qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir ...
        2. Seleccionar la herramienta ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Información adicional
      description: Capturas, logs, proveedor de IA usado, etc. **No incluyas claves de API.**
