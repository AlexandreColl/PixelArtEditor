name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Signed build provenance for each installer
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Signs the updates, so installed copies only accept ones built here
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - name: Check the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo '::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing; see CONTRIBUTING.md, Releases'
          exit 1

      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Fails the release when the changelog has no section for this version
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pixel Art Editor ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json, which installed copies read to find updates; Windows updates with the NSIS installer
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Checksums of the installers
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/checksums.mjs "$ARTIFACTS" checksums.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: checksums.txt
